name: Build Docker Image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - requirements.txt
      - entrypoint.sh
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - requirements.txt
      - entrypoint.sh
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/test.yml
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get version
        id: ara_version
        run: |
          version=$(grep ara requirements.txt | cut -d'=' -f3)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gather metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tigattack/ara
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}},value=${{ steps.ara_version.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ara_version.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{major}},value=${{ steps.ara_version.outputs.version }},enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.documentation=https://ara.readthedocs.io/en/latest

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.push }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
